# ESPHome config for Wyze Outdoor Plug (WLPPO1), ESP32-based.
# Based on the esphome-devices community config, updated for current ESPHome syntax.
substitutions:
  name: wyze-outdoor          # + MAC suffix -> wyze-outdoor-a1b2c3 (one image for all plugs)
  display_name: Wyze Outdoor
  current_res: "0.001"   # higher value -> lower watt reading
  voltage_div: "770"     # lower value -> lower voltage reading
  max_power: "1500"      # W; both outlets cut off above this (plug rated 15 A total)

esphome:
  name: ${name}
  friendly_name: ${display_name}
  name_add_mac_suffix: true

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key   # generate: openssl rand -base64 32

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"
    password: !secret fallback_password

captive_portal:

# Home Assistant Bluetooth proxy: extends HA's BLE range outdoors
esp32_ble_tracker:
bluetooth_proxy:
  active: true

# Troubleshooting page at http://wyze-outdoor-XXXXXX.local (states, controls, live logs).
# local: false loads the JS/CSS from esphome.io so it fits next to the BT proxy.
web_server:
  port: 80
  version: 3
  local: false
  auth:
    username: admin
    password: !secret web_password

status_led:
  pin: { number: GPIO5, inverted: true }

output:
  - { platform: gpio, pin: GPIO19, inverted: true, id: relay1_led_gpio }
  - { platform: gpio, pin: GPIO16, inverted: true, id: relay2_led_gpio }

light:
  - { platform: binary, id: relay1_led, internal: true, output: relay1_led_gpio }
  - { platform: binary, id: relay2_led, internal: true, output: relay2_led_gpio }

switch:
  - platform: gpio
    name: Outlet 1
    id: relay1
    pin: GPIO15
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:  [ light.turn_on: relay1_led ]
    on_turn_off: [ light.turn_off: relay1_led ]
  - platform: gpio
    name: Outlet 2
    id: relay2
    pin: GPIO32
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:  [ light.turn_on: relay2_led ]
    on_turn_off: [ light.turn_off: relay2_led ]

button:
  - platform: restart
    name: Restart

debug:
  update_interval: 60s

sensor:
  # Free RAM while running (BT proxy + web page both use heap); low/falling = trouble
  - platform: debug
    free:
      name: Free Memory
      entity_category: diagnostic
    block:
      name: Largest Free Block
      entity_category: diagnostic
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  - platform: adc
    pin: GPIO34
    name: Light Level
    id: lux_sensor
    unit_of_measurement: V
    attenuation: 12db
    update_interval: 10s
  - platform: hlw8012
    sel_pin: { number: GPIO25, inverted: true }
    cf_pin: GPIO27
    cf1_pin: GPIO26
    current_resistor: ${current_res}
    voltage_divider: ${voltage_div}
    change_mode_every: 3
    update_interval: 3s
    current: { name: Current, accuracy_decimals: 2 }
    voltage: { name: Voltage, accuracy_decimals: 1 }
    energy:  { name: Energy }
    power:
      name: Power
      id: power_w
      accuracy_decimals: 0
      filters:
        - calibrate_linear:
            - 0.0 -> 0.0
            - 134 -> 58
      # Overload cut-off runs on the plug itself, no HA needed.
      on_value_range:
        - above: ${max_power}
          then:
            - logger.log:
                level: WARN
                format: "Overload: %.0f W > ${max_power} W, cutting both outlets"
                args: [ x ]
            - switch.turn_off: relay1
            - switch.turn_off: relay2

binary_sensor:
  - platform: gpio
    internal: true
    pin: { number: GPIO18, mode: INPUT_PULLDOWN }
    name: Button 1
    on_press: [ switch.toggle: relay1 ]
  - platform: gpio
    internal: true
    pin: { number: GPIO17, mode: INPUT_PULLDOWN }
    name: Button 2
    on_press: [ switch.toggle: relay2 ]
  - platform: template
    name: Daylight
    device_class: light
    lambda: return id(lux_sensor).state > 2.0;   # ~3.1 V in light, ~0.5 V dark
