interface=__WIFI_IF__
bind-interfaces
except-interface=lo
dhcp-range=__DHCP_START__,__DHCP_END__,255.255.255.0,12h
dhcp-option=3,__AP_IP__          # gateway = this laptop
dhcp-option=6,__AP_IP__          # DNS     = this laptop (so we can spoof)
server=__UPSTREAM_DNS__          # everything not spoofed is forwarded upstream
log-queries
log-dhcp
__SPOOF_LINES__
